[project]
name = "ghana-assistant"
version = "0.1.0"
description = "Small-model assistant for Ghana: landmark-based directions (Accra, Kumasi) and grounded answers about Ghana"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch", "transformers>=4.45", "sentencepiece", "spacy>=3.7", "networkx", "numpy", "pandas", "pyarrow",
                "rapidfuzz", "huggingface_hub",
                "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]
maps = ["osmium"]
train = ["accelerate", "datasets", "peft"]

[project.scripts]
ghana-assistant = "ghana_assistant.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghana_assistant*"]

[tool.setuptools.package-data]
ghana_assistant = ["web/*.html"]
